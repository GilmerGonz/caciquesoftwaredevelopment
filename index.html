    <script>
      (function() {
        // Intercept and swallow benign fetch assignment errors from third-party polyfills
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1) {
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        try {
          var _fetch = window.fetch;
          var makeProp = function() {
            return {
              get: function() { return _fetch; },
              set: function(v) { _fetch = v; },
              configurable: true,
              enumerable: true
            };
          };

          var targets = [
            window,
            typeof globalThis !== 'undefined' ? globalThis : null,
            typeof self !== 'undefined' ? self : null,
            window.Window ? window.Window.prototype : null
          ];

          for (var i = 0; i < targets.length; i++) {
            var t = targets[i];
            if (t) {
              try {
                Object.defineProperty(t, 'fetch', makeProp());
              } catch (e) {}
            }
          }
        } catch (err) {}
      })();
    </script>
